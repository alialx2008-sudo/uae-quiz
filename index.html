<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>UAE Quiz | GEMS Westminster School</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A84C;--gold-l:#E8C97A;--gold-d:#8B6914;--red:#CC0001;--green:#007A3D;
  --dark:#0D1117;--card:#161C26;--brd:rgba(201,168,76,.3);--tx:#F5F0E8;--ok:#2ECC71;--bad:#E74C3C}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal', sans-serif;background:var(--dark);color:var(--tx);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:repeating-linear-gradient(45deg,rgba(201,168,76,.03) 0,rgba(201,168,76,.03) 1px,transparent 1px,transparent 60px),
  repeating-linear-gradient(-45deg,rgba(201,168,76,.03) 0,rgba(201,168,76,.03) 1px,transparent 1px,transparent 60px)}
.page{position:relative;z-index:1}
.screen{display:none;min-height:100vh}.screen.active{display:flex;flex-direction:column}
.hdr{background:linear-gradient(135deg,#0a0e14,#161C26,#0a0e14);border-bottom:2px solid var(--gold);
  padding:14px 22px;display:flex;align-items:center;justify-content:space-between;position:relative}
.hdr::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold-l),transparent)}
.logo{height:52px;object-fit:contain}.fi-img{height:34px;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.hdr-c{text-align:center}
.hdr-main{font-family:'Cinzel',serif;font-size:1rem;font-weight:700;color:var(--gold-l);letter-spacing:2px}
.hdr-sub{font-size:.68rem;color:rgba(201,168,76,.5);letter-spacing:2px;margin-top:2px}
.stripe{height:6px;background:linear-gradient(90deg,var(--red) 25%,#fff 25%,#fff 50%,var(--green) 50%,var(--green) 75%,#111 75%)}
.reg-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.reg-card{background:var(--card);border:1px solid var(--brd);border-radius:20px;padding:44px 38px;
  max-width:470px;width:100%;position:relative;box-shadow:0 0 60px rgba(201,168,76,.08),0 20px 60px rgba(0,0,0,.5)}
.reg-card::before{content:'✦';position:absolute;top:-18px;left:50%;transform:translateX(-50%);
  font-size:1.8rem;color:var(--gold);background:var(--dark);padding:0 12px;text-shadow:0 0 20px rgba(201,168,76,.8)}
.orn{text-align:center;margin-bottom:6px;color:var(--gold);font-size:1.3rem;letter-spacing:8px}
.t-main{text-align:center;font-family:'Cinzel',serif;font-size:1.45rem;font-weight:700;color:var(--gold-l);margin-bottom:4px}
.t-sub{text-align:center;font-size:.78rem;color:rgba(201,168,76,.5);letter-spacing:2px;margin-bottom:28px}
.fg{margin-bottom:16px}
.fl{display:block;font-size:.82rem;color:var(--gold-l);margin-bottom:7px;font-weight:600}
.fi{width:100%;padding:13px 16px;background:rgba(255,255,255,.04);border:1px solid rgba(201,168,76,.25);
  border-radius:10px;color:var(--tx);font-family:'Tajawal', sans-serif;font-size:.95rem;transition:all .3s;direction:rtl}
.fi:focus{outline:none;border-color:var(--gold);background:rgba(201,168,76,.05);box-shadow:0 0 0 3px rgba(201,168,76,.1)}
.fi::placeholder{color:rgba(255,255,255,.2)}
.sbtn{width:100%;padding:15px;background:linear-gradient(135deg,var(--gold-d),var(--gold),var(--gold-l));
  border:none;border-radius:12px;color:#0a0e14;font-family:'Cinzel',serif;
  font-size:.95rem;font-weight:700;cursor:pointer;transition:all .3s;margin-top:6px;
  box-shadow:0 4px 20px rgba(201,168,76,.3);letter-spacing:1.5px}
.sbtn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(201,168,76,.5)}
.qwrap{flex:1;padding:22px 18px;max-width:860px;margin:0 auto;width:100%}
.pb-bg{background:rgba(255,255,255,.06);border-radius:50px;height:7px;margin-bottom:6px;overflow:hidden}
.pb-fill{height:100%;border-radius:50px;background:linear-gradient(90deg,var(--gold-d),var(--gold-l));transition:width .5s ease}
.pi{display:flex;justify-content:space-between;font-size:.76rem;color:rgba(201,168,76,.55);margin-bottom:16px}
.sec-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(201,168,76,.1);
  border:1px solid rgba(201,168,76,.28);border-radius:50px;padding:5px 16px;
  font-size:.77rem;color:var(--gold-l);margin-bottom:14px;font-weight:600}
.qcard{background:var(--card);border:1px solid var(--brd);border-radius:20px;padding:28px;
  box-shadow:0 0 40px rgba(201,168,76,.05),0 8px 40px rgba(0,0,0,.4);animation:fiu .4s ease}
@keyframes fiu{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.qnum{font-size:.7rem;color:var(--gold);letter-spacing:2px;font-weight:700;margin-bottom:6px;font-family:'Cinzel',serif}
.qtxt{font-size:1.15rem;font-weight:700;color:var(--tx);margin-bottom:18px;line-height:1.6}
.ph-wrap{text-align:center;margin-bottom:20px}
.ph{width:168px;height:168px;object-fit:cover;border-radius:50%;border:3px solid var(--gold);
  box-shadow:0 0 0 6px rgba(201,168,76,.1),0 8px 40px rgba(0,0,0,.5);display:block;margin:0 auto}
.ph-cap{font-family:'Cinzel',serif;font-size:.7rem;color:rgba(201,168,76,.5);text-align:center;margin-top:8px;letter-spacing:1.5px}
.col-disp{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:14px 18px;margin-bottom:20px}
.swatch{width:56px;height:56px;border-radius:9px;flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.og{display:grid;gap:10px}
.ob{padding:13px 18px;background:rgba(255,255,255,.04);border:1px solid rgba(201,168,76,.18);
  border-radius:11px;color:var(--tx);font-family:'Tajawal', sans-serif;font-size:.93rem;cursor:pointer;
  text-align:right;transition:all .22s;display:flex;align-items:center;
  justify-content:space-between;direction:rtl;width:100%}
.ob:hover:not(:disabled){background:rgba(201,168,76,.08);border-color:var(--gold);transform:translateX(-3px)}
.ob.correct{background:rgba(46,204,113,.15);border-color:var(--ok);color:var(--ok)}
.ob.wrong{background:rgba(231,76,60,.15);border-color:var(--bad);color:var(--bad)}
.ob:disabled{cursor:default}
.oi{font-size:1.05rem;flex-shrink:0}
.fb{margin-top:12px;padding:12px 16px;border-radius:9px;font-size:.88rem;font-weight:600;display:none;animation:fiu .3s ease}
.fb.correct{background:rgba(46,204,113,.1);border:1px solid rgba(46,204,113,.3);color:var(--ok)}
.fb.wrong{background:rgba(231,76,60,.1);border:1px solid rgba(231,76,60,.3);color:var(--bad)}
.nbtn{margin-top:18px;padding:12px 28px;background:linear-gradient(135deg,var(--gold-d),var(--gold));
  border:none;border-radius:9px;color:#0a0e14;font-family:'Cinzel',serif;font-size:.85rem;font-weight:700;
  cursor:pointer;transition:all .3s;display:none;box-shadow:0 4px 18px rgba(201,168,76,.3);
  letter-spacing:1px;float:left}
.nbtn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(201,168,76,.5)}
.cf::after{content:'';display:table;clear:both}
.rwrap{flex:1;display:flex;align-items:center;justify-content:center;padding:36px 18px}
.rcard{background:var(--card);border:1px solid var(--brd);border-radius:24px;padding:42px 36px;
  max-width:520px;width:100%;text-align:center;box-shadow:0 0 80px rgba(201,168,76,.1),0 20px 60px rgba(0,0,0,.5)}
.trophy{font-size:4.5rem;margin-bottom:12px;animation:bnc 1s ease}
@keyframes bnc{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
.rname{font-size:1.3rem;font-weight:700;color:var(--gold-l);margin-bottom:3px;font-family:'Cinzel',serif}
.rcls{font-size:.83rem;color:rgba(255,255,255,.38);margin-bottom:26px;letter-spacing:1px}
.sc-ring{width:128px;height:128px;border-radius:50%;
  background:conic-gradient(var(--gold) 0deg var(--deg,0deg),rgba(255,255,255,.06) var(--deg,0deg));
  display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 0 40px rgba(201,168,76,.2)}
.sc-in{width:98px;height:98px;border-radius:50%;background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.sc-num{font-size:1.9rem;font-weight:700;color:var(--gold-l);font-family:'Cinzel',serif}
.sc-tot{font-size:.72rem;color:rgba(255,255,255,.38)}
.gl{font-size:1rem;font-weight:700;margin-bottom:6px;font-family:'Cinzel',serif;letter-spacing:1px}
.gl.ex{color:var(--ok)}.gl.gd{color:var(--gold)}.gl.nw{color:var(--bad)}
.ss{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}
.ssc{background:rgba(255,255,255,.04);border-radius:11px;padding:14px;border:1px solid rgba(201,168,76,.13)}
.ssc .lb{font-size:.7rem;color:rgba(255,255,255,.38);margin-bottom:4px;letter-spacing:.5px}
.ssc .sc{font-size:1.2rem;font-weight:700;color:var(--gold-l);font-family:'Cinzel',serif}
.sub-box{margin:16px 0;padding:14px 16px;border-radius:12px;font-size:.86rem;
  display:flex;align-items:center;gap:12px;text-align:right;direction:rtl}
.sub-box.loading{background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.25);color:var(--gold-l)}
.sub-box.success{background:rgba(46,204,113,.1);border:1px solid rgba(46,204,113,.3);color:var(--ok)}
.sub-box.error{background:rgba(231,76,60,.1);border:1px solid rgba(231,76,60,.3);color:var(--bad)}
.sub-icon{font-size:1.3rem;flex-shrink:0}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.rbtn{padding:12px 34px;background:linear-gradient(135deg,var(--gold-d),var(--gold));
  border:none;border-radius:11px;color:#0a0e14;font-family:'Cinzel',serif;
  font-size:.88rem;font-weight:700;cursor:pointer;transition:all .3s;
  box-shadow:0 4px 18px rgba(201,168,76,.3);letter-spacing:1px}
.rbtn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(201,168,76,.5)}
.trans{display:none;position:fixed;inset:0;background:var(--dark);z-index:100;
  align-items:center;justify-content:center;flex-direction:column;text-align:center}
.trans.show{display:flex;animation:fdi .5s ease}
@keyframes fdi{from{opacity:0}to{opacity:1}}
.tr-ic{font-size:4rem;margin-bottom:16px}
.tr-main{font-family:'Cinzel',serif;font-size:1.7rem;font-weight:700;color:var(--gold-l);margin-bottom:6px;letter-spacing:2px}
.tr-sub{font-size:.85rem;color:rgba(201,168,76,.45);letter-spacing:3px}
.tr-bar{width:170px;height:4px;background:rgba(255,255,255,.08);border-radius:4px;margin:20px auto 0;overflow:hidden}
.tr-fill{height:100%;border-radius:4px;width:0;background:linear-gradient(90deg,var(--gold-d),var(--gold-l));animation:fb2 2.3s ease forwards}
@keyframes fb2{to{width:100%}}
@media(max-width:560px){.reg-card,.rcard{padding:26px 16px}.qcard{padding:18px 12px}.ph{width:126px;height:126px}.ss{grid-template-columns:1fr}}
</style>
</head>

  function img(id){ return document.getElementById('img_'+id).src; }
  var IMGS = {
    mbz:img('sheikh_mbz'),mbr:img('sheikh_mbr'),sultan:img('sheikh_sultan'),
    hamid:img('sheikh_hamid'),saud_mualla:img('sheikh_saud_mualla'),
    saud_qasimi:img('sheikh_saud_qasimi'),hamad:img('sheikh_hamad'),
    flag:img('uae_flag'),logo:img('school_logo')
  };

  // Set logos & flags
  ['logo1','logo2','logo3'].forEach(function(id){document.getElementById(id).src=IMGS.logo;});
  ['flag1','flag2','flag3'].forEach(function(id){document.getElementById(id).src=IMGS.flag;});

  // Apply text
  var textIds=['hdr_main','hdr_sub','reg_title','reg_sub','name_lbl','class_lbl',
    'start_btn','res_hdr','res_sub','sec1_lbl','sec2_lbl','retry_btn'];
  textIds.forEach(function(id){
    var el=document.getElementById(id);
    if(el&&T[id]){el.textContent=T[id];}
  });
  document.getElementById('iName').placeholder = T.name_ph;
  document.getElementById('iClass').placeholder = T.class_ph;
  document.getElementById('nBtn').textContent = T.next_btn;
  document.getElementById('tr_main').textContent = T.tr_part2;
  document.getElementById('tr_sub').textContent = T.tr_sub;
  document.getElementById('tr_en').textContent = T.tr_en;

  var sName='',sCls='',cur=0,score=0,s1=0,s2=0,done=false,qs=[];

  function shuffle(q){
    var c=JSON.parse(JSON.stringify(q));
    var correct=c.opts[c.ci];
    for(var i=c.opts.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var t=c.opts[i];c.opts[i]=c.opts[j];c.opts[j]=t;
    }
    c.ci=c.opts.indexOf(correct);
    return c;
  }

  function show(id){
    document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
    document.getElementById(id).classList.add('active');
  }

  window.startQuiz=function(){
    sName=document.getElementById('iName').value.trim();
    sCls=document.getElementById('iClass').value.trim();
    if(!sName||!sCls){alert(T.alert);return;}
    qs=QS.map(shuffle);cur=0;score=0;s1=0;s2=0;
    document.getElementById('dName').textContent=sName;
    document.getElementById('dClass').textContent=sCls;
    show('sQuiz');render();
  };

  function render(){
    var q=qs[cur],tot=qs.length;done=false;
    document.getElementById('pbFill').style.width=(cur/tot*100)+'%';
    document.getElementById('piTxt').textContent=T.q_prefix+' '+(cur+1)+' '+T.of+' '+tot;
    document.getElementById('piScore').textContent=T.score_lbl+' '+score;
    document.getElementById('secBadge').innerHTML='📌 '+q.sl;
    document.getElementById('qNum').textContent=T.q_prefix+' '+(cur+1);

    var ph=document.getElementById('phWrap');
    if(q.photo){
      ph.innerHTML='<div class="ph-wrap"><img class="ph" src="'+IMGS[q.photo]+'" alt="">'+
        (q.role?'<div class="ph-cap">'+q.role+'</div>':'')+'</div>';
    }else{ph.innerHTML='';}

    var cw=document.getElementById('colWrap');
    if(q.color){
      var brd=(q.color==='#F0F0F0')?'border:1px solid rgba(0,0,0,.12);':'';
      cw.innerHTML='<div class="col-disp">'+
        '<div class="swatch" style="background:'+q.color+';'+brd+'"></div>'+
        '<div><div style="font-family:Cinzel,serif;font-size:1rem;font-weight:700;color:var(--gold-l)">'+q.cn+'</div>'+
        '<div style="font-size:.76rem;color:rgba(255,255,255,.35);margin-top:2px">'+q.cen+' — UAE Flag Color</div>'+
        '<img src="'+IMGS.flag+'" style="width:68px;margin-top:8px;border-radius:4px" alt="UAE Flag"></div></div>';
    }else{cw.innerHTML='';}

    document.getElementById('qTxt').textContent=q.q;
    var og=document.getElementById('oGrid');og.innerHTML='';
    q.opts.forEach(function(opt,i){
      var b=document.createElement('button');b.className='ob';
      b.innerHTML='<span>'+opt+'</span><span class="oi">○</span>';
      b.addEventListener('click',function(){pick(i);});
      og.appendChild(b);
    });

    var fb=document.getElementById('fbBox');
    fb.style.display='none';fb.className='fb';
    document.getElementById('nBtn').style.display='none';
    var card=document.getElementById('qCard');
    card.style.animation='none';card.offsetHeight;card.style.animation='fiu .4s ease';
  }

  function pick(sel){
    if(done)return;done=true;
    var q=qs[cur],ok=(sel===q.ci);
    document.querySelectorAll('.ob').forEach(function(b,i){
      b.disabled=true;var ic=b.querySelector('.oi');
      if(i===q.ci){b.classList.add('correct');ic.textContent='✓';}
      else if(i===sel&&!ok){b.classList.add('wrong');ic.textContent='✗';}
    });
    if(ok){score++;if(q.sec===1)s1++;else s2++;}
    document.getElementById('piScore').textContent=T.score_lbl+' '+score;
    var fb=document.getElementById('fbBox');
    fb.className=ok?'fb correct':'fb wrong';
    fb.innerHTML=ok?T.correct_msg:T.wrong_prefix+q.opts[q.ci];
    fb.style.display='block';
    document.getElementById('nBtn').style.display='block';
  }

  window.nextQ=function(){
    var cs=qs[cur].sec;cur++;
    if(cur>=qs.length){showRes();return;}
    if(cs===1&&qs[cur].sec===2){
      var ov=document.getElementById('trans');ov.classList.add('show');
      var bar=document.getElementById('trFill');
      bar.style.animation='none';bar.offsetHeight;bar.style.animation='fb2 2.3s ease forwards';
      setTimeout(function(){ov.classList.remove('show');render();},2600);
    }else{render();}
  };

  function setSubBox(cls,icon,msg,sub){
    var box=document.getElementById('subBox');
    box.className='sub-box '+cls;
    document.getElementById('sb_msg').textContent=msg;
    document.getElementById('sb_sub').textContent=sub;
    box.querySelector('.sub-icon').innerHTML=icon;
  }

  function submitToFormspree(data){
    setSubBox('loading','<span class="spin">⏳</span>',T.save_loading,T.save_loading2);
    if(!FORMSPREE_URL||FORMSPREE_URL===''){
      setSubBox('error','⚙️',T.save_no,T.save_no2);return;
    }
    var pct=Math.round(data.score/data.total*100);
    fetch(FORMSPREE_URL,{
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(data)
    }).then(function(){
      setSubBox('success','✅',T.save_ok,T.save_ok2);
    }).catch(function(){setSubBox('error','❌',T.save_err,T.save_err2);});
  }

  function showRes(){
    var tot=qs.length,pct=Math.round(score/tot*100);
    var tr,gr,gc;
    if(pct>=80){tr='🏆';gr=T.grade_ex;gc='ex';}
    else if(pct>=60){tr='⭐';gr=T.grade_gd;gc='gd';}
    else{tr='📚';gr=T.grade_nw;gc='nw';}
    document.getElementById('troph').textContent=tr;
    document.getElementById('rName').textContent=sName;
    document.getElementById('rCls').textContent=sCls;
    document.getElementById('rNum').textContent=score;
    document.getElementById('rTot').textContent=T.out_of+' '+tot;
    document.getElementById('gLbl').textContent=gr;
    document.getElementById('gLbl').className='gl '+gc;
    document.getElementById('s1sc').textContent=s1+' / 7';
    document.getElementById('s2sc').textContent=s2+' / 4';
    document.getElementById('ring').style.setProperty('--deg',Math.round(pct/100*360)+'deg');
    show('sRes');
    submitToFormspree({name:sName,cls:sCls,score:score,total:tot,sec1:s1,sec2:s2,lang:'AR'});
  }

  window.retry=function(){
    show('sReg');
    document.getElementById('iName').value='';
    document.getElementById('iClass').value='';
  };
})();
</script>
